name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  # FLAG: Pending jobs also replace each other in a concurrency group. Give
  # non-PR runs unique groups so every main SHA can finish its gate.
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - '**/*.test.*'
              - '**/*.spec.*'
      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          upload-database: false
      - name: Reject open high-severity alerts
        env:
          CODEQL_ANALYSIS_CATEGORY: .github/workflows/codeql.yml:analyze
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/assert-codeql-alerts.mjs
