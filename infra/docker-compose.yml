x-spammer-read-model-shadow-env: &spammer-read-model-shadow-env
  RUNTIME_OVERVIEW_READER_TOKEN_SHA256: ''
  NODE_ENV: production
  STATISTICS_EXCHANGE_V3_ENABLED: ${STATISTICS_EXCHANGE_V3_ENABLED:-false}
  COMMERCIAL_LLM_POOL_WORKERS_ENABLED: ${COMMERCIAL_LLM_POOL_WORKERS_ENABLED:-false}
  COMMERCIAL_LLM_POOL_ENABLED: ${COMMERCIAL_LLM_POOL_ENABLED:-false}
  COMMERCIAL_LLM_POOL_4B_POLICY: ${COMMERCIAL_LLM_POOL_4B_POLICY:-confirm-positive}
  MAX_PUBLISHER_ACCESS_REFRESH_MODE: ${MAX_PUBLISHER_ACCESS_REFRESH_MODE:-canary}
  SPAMMER_PROFILE_CACHE_ENABLED: 'true'
  SPAMMER_READ_MODEL_SHADOW_ENABLED: 'true'
  SPAMMER_READ_MODEL_SHADOW_SAMPLE_RATE: '0.1'
  SPAMMER_READ_MODEL_ENFORCEMENT_ENABLED: 'false'
  SPAMMER_OBSERVATION_DENORM_QUEUE_ENABLED: 'false'
  SPAMMER_OBSERVATION_FAST_PATH_ENABLED: 'false'
  SPAMMER_OBSERVATION_FAST_PATH_SOURCES: COMMERCIAL_AD,COMMERCIAL_CAMPAIGN,REPEATED_LINK,REPEATED_PHONE
  MODERATION_DELETE_INTENT_MODE: ${MODERATION_DELETE_INTENT_MODE:-shadow}
  MODERATION_DELETE_INTENT_CANARY_CHAT_IDS: ${MODERATION_DELETE_INTENT_CANARY_CHAT_IDS:-}
  MODERATION_DELETE_CROSS_BOT_CANARY_CHAT_IDS: ${MODERATION_DELETE_CROSS_BOT_CANARY_CHAT_IDS:-}
  MODERATION_DELETE_INTENT_REPLACEMENT_CLEANUP_ENABLED: ${MODERATION_DELETE_INTENT_REPLACEMENT_CLEANUP_ENABLED:-false}
  COMMERCIAL_OCR_ROLLOUT_MODE: ${COMMERCIAL_OCR_ROLLOUT_MODE:-shadow}
  IMAGE_TEXT_STOP_LIST_OCR_ROLLOUT_MODE: ${IMAGE_TEXT_STOP_LIST_OCR_ROLLOUT_MODE:-on}
  COMMERCIAL_OCR_CANARY_CHAT_IDS: ${COMMERCIAL_OCR_CANARY_CHAT_IDS:-}
  COMMERCIAL_OCR_VERSION: ${COMMERCIAL_OCR_VERSION:-tesseract-rus-eng-v2}
  COMMERCIAL_OCR_CERTIFICATION_APPROVAL_PUBLIC_KEY_BASE64: ${COMMERCIAL_OCR_CERTIFICATION_APPROVAL_PUBLIC_KEY_BASE64:-}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '${DOCKER_LOG_MAX_SIZE:-10m}'
    max-file: '${DOCKER_LOG_MAX_FILE:-5}'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    shm_size: 512m
    environment:
      POSTGRES_USER: maxim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maxim}
      POSTGRES_DB: maxim
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ['redis-server', '--save', '3600', '1', '--appendonly', 'no']
    stop_grace_period: 15m
    volumes:
      - redis_data:/data

  # FLAG: Lastik owns its stores and MAX credentials; it is not a shared API role.
  eraser-postgres:
    image: postgres:16-alpine
    profiles: [eraser]
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256m
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    environment:
      POSTGRES_USER: eraser
      POSTGRES_DB: eraser
      POSTGRES_PASSWORD_FILE: /run/secrets/eraser_postgres_password
      TZ: UTC
      PGTZ: UTC
    secrets: [eraser_postgres_password]
    networks: [eraser_stores]
    volumes:
      - eraser_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eraser -d eraser']
      interval: 5s
      timeout: 3s
      retries: 12

  eraser-redis:
    image: redis:7-alpine
    profiles: [eraser]
    restart: unless-stopped
    logging: *default-logging
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    stop_grace_period: 1m
    networks: [eraser_stores]
    volumes:
      - eraser_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  eraser:
    image: ${MAXIM_ERASER_IMAGE:-maxim-eraser:local}
    profiles: [eraser]
    build:
      context: ..
      dockerfile: apps/eraser/Dockerfile
      args:
        COMMIT_SHA: ${MAXIM_EXPECTED_DEPLOY_SHA:-local}
      labels:
        com.maxim.release-protected: 'true'
        org.opencontainers.image.revision: ${MAXIM_EXPECTED_DEPLOY_SHA:-local}
    restart: unless-stopped
    init: true
    logging: *default-logging
    env_file:
      - path: ${MAXIM_ERASER_ENV_FILE:-/var/lib/maxim-secrets/eraser.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: UTC
      COMMIT_SHA: ${MAXIM_ERASER_SOURCE_SHA:-${MAXIM_EXPECTED_DEPLOY_SHA:-local}}
      ERASER_MAX_RPS: 20
      ERASER_REDIS_URL: redis://eraser-redis:6379/0
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/russian-trusted-ca-bundle.crt
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,nosuid,size=32m']
    networks: [default, eraser_stores]
    depends_on:
      eraser-postgres:
        condition: service_healthy
      eraser-redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3005:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3000/health").then(async r=>{const b=await r.json();process.exit(r.ok&&b.status==="ok"&&b.service==="eraser"?0:1)}).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  api-ingress:
    image: ${MAXIM_API_IMAGE:-maxim-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ${MAXIM_COMPOSE_SERVICE_ENV_FILE:-../.env}
    environment:
      <<: *spammer-read-model-shadow-env
      APP_SERVICE_NAME: api-ingress
      APP_ROLE: ingress
      PRISMA_PG_POOL_MAX: 6
      PRISMA_PG_POOL_IDLE_TIMEOUT_MS: 10000
      PRISMA_PG_POOL_CONNECTION_TIMEOUT_MS: 5000
      PRISMA_PG_STATEMENT_TIMEOUT_MS: 15000
      MAX_API_GLOBAL_RPS: 25
      MAX_API_GLOBAL_BURST: 0
      MAX_API_GLOBAL_RPS_CRITICAL: 12
      MAX_API_GLOBAL_RPS_INTERACTIVE: 10
      MAX_API_GLOBAL_RPS_BACKGROUND: 4
      MAX_API_CHAT_RPS: 5
      MAX_API_LIST_BOT_CHATS_CACHE_SEC: 120
      MAX_API_CHAT_SNAPSHOT_CACHE_SEC: 300
      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
      MAX_PUBLISHER_BOT_ID: ${MAX_PUBLISHER_BOT_ID:-se14088825_bot}
      PUBLISHER_POST_IMPORT_ENABLED: ${PUBLISHER_POST_IMPORT_ENABLED:-true}
      MAX_PUBLISHER_WEBHOOK_CREDENTIALS_FILE: /run/secrets/max_publisher_webhook_credentials
    secrets:
      - max_publisher_webhook_credentials
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3001:3001'

