      MANAGED_ENTITY_HEADER_CACHE_SEC: 3600
    volumes:
      - photo_native_ipc:/run/maxim-photo:ro
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      photo-native-sandbox:
        condition: service_healthy

  photo-native-sandbox:
    image: infra-scale-api-ingress:latest
    labels:
      com.maxim.photo-native-sandbox: 'true'
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command:
      - node
      - apps/api/dist/apps/api/src/moderation/photo-duplicate/native-photo-sandbox.entrypoint.js
    restart: unless-stopped
    init: true
    user: '1000:1000'
    network_mode: none
    deploy:
      replicas: 1
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 64
    read_only: true
    cap_drop:
      - ALL
    security_opt: !override
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=1000,gid=1000
    logging: *default-logging
    environment:
      NODE_ENV: production
      PHOTO_NATIVE_SANDBOX_SOCKET_PATH: /run/maxim-photo/native-photo.sock
      PHOTO_DUPLICATE_MAX_BYTES: 16777216
      PHOTO_DUPLICATE_MAX_PIXELS: 40000000
      VIPS_CONCURRENCY: 1
    volumes:
